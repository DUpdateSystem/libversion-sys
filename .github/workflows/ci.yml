name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-generated:
    name: Check Generated Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: bash scripts/generate-headers.sh
      - name: Verify generated headers are up to date
        run: |
          if ! git diff --exit-code generated/; then
            echo "::error::Generated headers are out of date. Run 'bash scripts/generate-headers.sh' and commit the changes."
            exit 1
          fi

  clippy-sarif:
    name: Clippy SARIF
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' }}
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: cargo install clippy-sarif sarif-fmt
      - run: >
          cargo clippy --all-targets --all-features --message-format=json -- -Dwarnings |
          clippy-sarif | tee results.sarif | sarif-fmt
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (vendored)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: cargo test

  test-system:
    name: Test (system libversion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev pkg-config
      - name: Build and install libversion for pkg-config mode
        run: |
          cmake -S libversion -B "$RUNNER_TEMP/libversion-build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/libversion-install"
          cmake --build "$RUNNER_TEMP/libversion-build"
          cmake --install "$RUNNER_TEMP/libversion-build"
      - name: Test without vendored feature
        run: cargo test --no-default-features
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/libversion-install/lib/pkgconfig:${{ runner.temp }}/libversion-install/lib64/pkgconfig
          LD_LIBRARY_PATH: ${{ runner.temp }}/libversion-install/lib:${{ runner.temp }}/libversion-install/lib64
